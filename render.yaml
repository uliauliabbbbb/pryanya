# ─── Render: бэкенд Пряни (server) ──────────────────────────────
# Blueprint для Render. На dashboard: New → Blueprint → выбрать репозиторий.
# Render прочитает этот файл и создаст web-сервис.
#
# Перед первым деплоем нужно задать секреты (sync: false) в UI Render:
#   DATABASE_URL  — строка подключения к Neon (с ?sslmode=require)
#   CLIENT_ORIGIN — адрес сайта на Netlify (https://<имя>.netlify.app)

services:
  - type: web
    name: pranya-api
    runtime: node
    plan: free
    rootDir: server
    healthCheckPath: /api/health
    # Миграции уже применены к Neon вручную; на сборке deploy идёт как
    # no-op. `|| true` — чтобы кратковременный обрыв связи с Neon
    # (он засыпает) не ронял весь деплой.
    buildCommand: npm install && npm run prisma:generate && npm run build && (npm run prisma:deploy || true)
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      # Neon зависает на session advisory-lock у `migrate deploy` (P1002).
      # Отключаем lock — для одиночного инстанса это безопасно.
      - key: PRISMA_SCHEMA_DISABLE_ADVISORY_LOCK
        value: "1"
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_SECRET
        generateValue: true     # Render сгенерирует надёжный секрет сам
      - key: DATABASE_URL
        sync: false             # вставить строку Neon вручную в UI
      - key: CLIENT_ORIGIN
        sync: false             # вставить URL сайта Netlify после деплоя фронта
